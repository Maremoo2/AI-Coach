[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coach-engine"
version = "1.2.0"
description = "Deterministic premium coaching with an athlete learning and response-profile foundation"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
ai-coach = "ai_coach.cli:main"
ai-coach-v1 = "ai_coach.coach_cli:main"
ai-coach-experience = "ai_coach.experience_cli:main"
ai-coach-profile = "ai_coach.profile_cli:main"

[tool.setuptools]
packages = ["ai_coach", "ai_coach.schemas"]
package-dir = {ai_coach = "src/ai_coach", "ai_coach.schemas" = "schemas"}

[tool.setuptools.package-data]
"ai_coach.schemas" = ["*.json"]
